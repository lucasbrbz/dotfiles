[colors]
bg = #aa000000
bg-alt = #aa000000
fg = #ffffff
fg-alt = #aea79f
accent = #e95420
urgent = #aac01c28

[bar/bottom]
monitor = ${env:MONITOR:}
width = 100%:-40
height = 40
radius = 10

offset-x = 20
offset-y = 14

bottom = true
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 0
border-size = 0

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = UbuntuMono Nerd Font:size=11;2

wm-restack = bspwm
override-redirect = false
enable-ipc = true

cursor-click = pointer
cursor-scroll = ns-resize

modules-left = bspwm
modules-center = network cpu memory
modules-right = wired-network wireless-network pulseaudio battery date time
separator = |

#tray-position = right
#tray-padding = 1
#tray-background = ${colors.bg}
#tray-maxsize = 20

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = true
enable-click = true
enable-scroll = false
reverse-scroll = false

format = <label-state>
format-padding = 0

ws-icon-0 = 1;
ws-icon-1 = 2;󰖟
ws-icon-2 = 3;
ws-icon-3 = 4;󱔘
ws-icon-4 = 5;5
ws-icon-5 = 6;6
ws-icon-6 = 7;7
ws-icon-7 = 8;8
ws-icon-8 = 9;
ws-icon-9 = 10;
ws-icon-default = 

label-focused =  %icon% 
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.fg}
label-focused-padding = 1

label-occupied =  %icon% 
label-occupied-foreground = ${colors.fg}
label-occupied-background = ${colors.bg}
label-occupied-padding = 1

label-empty =  %icon% 
label-empty-foreground = ${colors.fg-alt}
label-empty-background = ${colors.bg}
label-empty-padding = 1

label-urgent =  %icon% 
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.fg}
label-urgent-padding = 1

label-separator = " "
label-separator-foreground = ${colors.bg}

[module/playerctl]
type = custom/script
exec = playerctl metadata --format '{{ artist }} - {{ title }}' 2>/dev/null
interval = 1
format = <label>
label =   %output%
click-left = playerctl play-pause
click-middle = playerctl previous
click-right = playerctl next

[module/cpu]
type = internal/cpu
interval = 0.5
warn-percentage = 95
label =   %percentage%%
format = <label>
label-warn =   %percentage%%
format-warn = <label-warn>

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 95
label =   %percentage_used%%
format = <label>
label-warn =   %percentage_used%%
format-warn = <label-warn>

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume =   %percentage%%
label-muted =  Mute
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
click-right = pavucontrol
interval = 1

[module/wireless-network]
type = internal/network
interface = wlp0s20f3
interface-type = wireless
accumulate-stats = true
interval = 3
format-connected = <label-connected>
label-connected =   %essid% (%downspeed%)
format-disconnected = <label-disconnected>
label-disconnected = 󰤮  Off

[module/wired-network]
type = internal/network
interface = enx6c1ff7068326
interface-type = wired
accumulate-stats = true
interval = 3
format-connected = <label-connected>
label-connected =   (%downspeed%)
#label-connected =   (%linkspeed%)

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 10
low-at = 15
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging =   %percentage%%
label-discharging =   %percentage%%
label-full =   %percentage%%

[module/date]
type = internal/date
interval = 1
date = %a, %b %d
label = 󰃭  %date%

[module/time]
type = internal/date
interval = 1
time = %H:%M
label =    %time%